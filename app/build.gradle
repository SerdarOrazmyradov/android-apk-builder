plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.sampleapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.sampleapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Material Design 1.x compatible with API 21 (Android 5.0+)
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.3.2'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    
    // HTTP Client & Networking (API 21+ compatible)
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    
    // Google Play Services (API 21+ compatible)
    implementation 'com.google.android.gms:play-services-basement:18.3.0'
    
    // Enhanced SSL/TLS Security (API 21+ compatible)
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    
    // JSON Parsing (for API responses, API 14+ compatible)
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
