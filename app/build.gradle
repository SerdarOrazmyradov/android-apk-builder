plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.sampleapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.sampleapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // GitHub Actions ENV diýip berlen maýdalary get etmek
        def serdarKey = System.getenv("SERDAR_GEMINI_KEY") ?: ""
        def jennetKey = System.getenv("JENNET_GEMINI_KEY") ?: ""
        def maralKey = System.getenv("MARAL_GEMINI_KEY") ?: ""
        def ejemKey = System.getenv("EJEM_GEMINI_KEY") ?: ""

        buildConfigField "String", "SERDAR_GEMINI_KEY", "\"${serdarKey}\""
        buildConfigField "String", "JENNET_GEMINI_KEY", "\"${jennetKey}\""
        buildConfigField "String", "MARAL_GEMINI_KEY", "\"${maralKey}\""
        buildConfigField "String", "EJEM_GEMINI_KEY", "\"${ejemKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.3.2'
    implementation 'com.google.android.material:material:1.3.0'
    
    // Android 5.1 (API 21/22) üçin OkHttp 3.12.x wersiýasy hökmany
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.code.gson:gson:2.8.9'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}